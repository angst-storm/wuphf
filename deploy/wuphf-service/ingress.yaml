apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wuphf
  labels:
    app: wuphf
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: /<server-servlet-context-path>
        backend:
          service:
            name: wuphf
            port:
              number: 80
