apiVersion: apps/v1
kind: Deployment
metadata:
  name: wuphf
  labels:
    app: wuphf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wuphf
  template:
    metadata:
      labels:
        app: wuphf
    spec:
      containers:
        - name: jvm
          image: <image-name>:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9001
          envFrom:
            - secretRef:
                name: wuphf-config
